services:
  recommender-api:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./catalog:/app/catalog
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
